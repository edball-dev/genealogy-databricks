name: Data Quality

on:
  schedule:
    # 4:00 AM UTC — two hours after the 2am UTC OCR pipeline run and any
    # manual GEDCOM refresh, so checks run against settled data.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tests/data_quality/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/data_quality/requirements.txt

      - name: Run data quality checks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE: ${{ secrets.DATABRICKS_WAREHOUSE }}
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
        run: python tests/data_quality/run_checks.py
