# Soda Core v4 data contract: genealogy.gold_dna_coverage
#
# dataset identifier is slash-separated catalog/schema/table (confirmed via
# soda_core.common.yaml.YamlObject.read_dataset_identifier — NOT dot
# notation, a real pre-v4-vs-v4 gotcha the pilot spec warned about).
#
# Check syntax: the check TYPE NAME is the YAML key itself (`- missing:`),
# not a `type: missing` field, despite every check-type class in
# soda_core/contracts/impl/check_types/*_yaml.py taking a `type_name`
# constructor argument that would suggest otherwise — confirmed the hard
# way (soda contract test rejected `type: missing` with "Checks require 1
# key to be the type") by reading _parse_checks in
# soda_core/contracts/impl/contract_yaml.py, which pops the check's single
# YAML key as the type name. Not documented anywhere I found short of
# reading that method.
dataset: workspace/genealogy/gold_dna_coverage

columns:
  - name: branch
    checks:
      - missing:
          must_be: 0
      - duplicate:
          must_be: 0

  - name: dna_matches_total
    checks:
      - missing:
          must_be: 0

# Custom aggregate reconciliation (spec §2 check 3, reproduces DQ-008).
# This needs a JOIN against a second table (gold_person_dna) per branch —
# outside what the built-in `aggregate` check type can express (it computes
# one SQL function over one column of the dataset itself, see
# soda_core/contracts/impl/check_types/aggregate_check_yaml.py). failed_rows
# in `query` form is the only v4 check type flexible enough for this,
# confirmed by reading its parser: it accepts an arbitrary SQL query and
# fails when it returns any rows.
checks:
  - failed_rows:
      name: dna_matches_total_reconciliation
      must_be: 0
      query: |
        SELECT c.branch, c.dna_matches_total AS reported_total, COUNT(*) AS recomputed_total
        FROM workspace.genealogy.gold_dna_coverage c
        LEFT JOIN workspace.genealogy.gold_person_dna d
          ON d.branch = c.branch AND d.dna_role = 'DNA Match'
        GROUP BY c.branch, c.dna_matches_total
        HAVING c.dna_matches_total != COUNT(*)
