# Soda Core v4 data contract: genealogy.gold_source_coverage
dataset: workspace/genealogy/gold_source_coverage

columns:
  # event_id is currently 100% NULL (open bug, tracked as DQ-004 /
  # Asana 1218420283884341). Soda's contract model has no native
  # known_failing concept (see pilot README §3 finding) — this check is
  # written with an explicit threshold that reflects the current (bad)
  # reality, with a comment as the only "this is expected" signal, rather
  # than a first-class flag the way the hand-rolled registry has one.
  - name: event_id
    checks:
      - missing:
          name: event_id_currently_all_null_DQ_004
          # Expected to fail: all 17172 rows are NULL right now (DQ-004,
          # Asana 1218420283884341). must_be_less_than_or_equal here means
          # "don't let it get any worse than 100%" rather than "must be 0"
          # — the closest native equivalent to known_failing Soda offers,
          # and it only works because we already know the exact current
          # count (a magic number that will silently stop meaning anything
          # the day the row count changes).
          must_be_less_than_or_equal: 17172

  - name: person_gedcom_id
    checks:
      - missing:
          must_be: 0

# No duplicate check on this table: spec §1 notes there's no confirmed
# single-column natural key (event_id is a candidate but is 100% NULL).
