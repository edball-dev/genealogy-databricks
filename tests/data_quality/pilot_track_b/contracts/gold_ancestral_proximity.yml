# Soda Core v4 data contract: genealogy.gold_ancestral_proximity
dataset: workspace/genealogy/gold_ancestral_proximity

columns:
  - name: person_id
    checks:
      - missing:
          must_be: 0
      - duplicate:
          must_be: 0

  - name: ancestral_proximity
    checks:
      - missing:
          must_be: 0

# Custom business rule (spec §2 check 4, reproduces DQ-006): no person_id
# should have more than one distinct is_blood_relative value. This is a
# GROUP BY ... HAVING, not a per-row predicate, so it needs failed_rows in
# `query` form (same reasoning as gold_dna_coverage.yml) rather than the
# `expression` form, which only supports a boolean condition evaluated
# per-row against the dataset's own columns.
checks:
  - failed_rows:
      name: blood_relative_mutual_exclusivity
      must_be: 0
      query: |
        SELECT person_id, COUNT(DISTINCT is_blood_relative) AS distinct_flags
        FROM workspace.genealogy.gold_ancestral_proximity
        GROUP BY person_id
        HAVING COUNT(DISTINCT is_blood_relative) > 1
